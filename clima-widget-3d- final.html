<!DOCTYPE html>
<!--
  Widget de clima 3D: 10 estados x día/noche = 20 variantes (códigos WMO de Open-Meteo).
  Integración: pegá <style> (entre comentarios), <div class="wx3d"> y el <script>.
  Open-Meteo:  fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.9&longitude=-56.2&current=weather_code,is_day,temperature_2m,wind_speed_10m').then(r=>r.json()).then(d=>wx3dFromOpenMeteo(d.current,{waves:1.2}))
  Uso manual:  wx3dSet({cond:'storm', night:true, temp:17, city:'Montevideo', waves:1.8, wind:34})   // time:'14:35' es opcional; si falta, se usa la hora de tz (por defecto America/Montevideo)
  Condiciones: clear fewclouds partly overcast fog drizzle rain heavy showers storm
  Accesibilidad: por defecto el clima SIEMPRE se anima. Para respetar 'reducir movimiento' del sistema agregá data-respect-motion al <div class="wx3d">.
  El bloque .demo y el fondo del body son solo para probar: borralos al integrar.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget clima 3D · 10 estados x día/noche</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;background:#e9edf2;font-family:system-ui,sans-serif}
.demo{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:14px}
.demo select,.demo button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid #9aa8b6;background:#fff}
.demo label{display:flex;align-items:center;gap:4px}

/* ===== WIDGET: copiar desde acá ===== */
.wx3d{--wx-w:380px;--wx-ink:#f2f8ff;--wx-ink2:#c3d6e8;--wx-edge:#16324d;--b1:#4f86bd;--b2:#1c3f68;
  width:min(var(--wx-w),100%);perspective:900px;touch-action:pan-y;
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--wx-ink)}
.wx3d *{box-sizing:border-box}
.wx3d-card{position:relative;transform-style:preserve-3d;transition:transform .18s ease-out;
  transform:rotateX(4deg) rotateY(-14deg);animation:wx3d-float 7s ease-in-out infinite}
.wx3d.is-active .wx3d-card{animation:none}
.wx3d-layer{position:absolute;inset:0;border-radius:24px;background:var(--b2)}
.wx3d-layer:nth-child(1){transform:translateZ(-5px);filter:brightness(.8)}
.wx3d-layer:nth-child(2){transform:translateZ(-10px);filter:brightness(.65)}
.wx3d-layer:nth-child(3){transform:translateZ(-15px);filter:brightness(.5);box-shadow:0 40px 50px -15px rgba(10,25,45,.45)}
.wx3d-face{position:relative;transform-style:preserve-3d;border-radius:24px;padding:28px}
.wx3d-bg{position:absolute;inset:0;border-radius:24px;overflow:hidden;
  background:linear-gradient(160deg,var(--b1),var(--b2));border:1px solid rgba(255,255,255,.35);transition:background .5s}
.wx3d-bg>*,.wx3d-fx>*,.wx3d-stars>*{position:absolute}
.wx3d-stars{inset:-12px;transform:translate(calc(var(--px,0)*-7px),calc(var(--py,0)*-7px));transition:transform .18s ease-out}
.wx3d-glassfx{inset:0;width:100%;height:100%;opacity:0;transition:opacity .5s}.wx3d-glassfx.on{opacity:1}
.wx3d-lite{inset:0;opacity:0}
.wx3d-pback{inset:0;width:100%;height:100%}
.wx3d-pfront{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:translateZ(60px)}
.wx3d-bolts{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transform:translateZ(40px)}
.wx3d.shake .wx3d-face{animation:wx3d-shake .35s}
.wx3d-milky{inset:-10%;background:linear-gradient(115deg,transparent 32%,rgba(170,190,255,.16) 50%,transparent 68%);filter:blur(6px)}
.wx3d-sky{top:-40px;right:-40px;width:190px;aspect-ratio:1;
  transform:translate(calc(var(--px,0)*-16px),calc(var(--py,0)*-16px));transition:transform .18s ease-out}
.wx3d-sunwrap{inset:0}
.wx3d-sunwrap>*{position:absolute}
.wx3d-rays{inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,220,110,.6) 0 5deg,transparent 5deg 18deg);
  -webkit-mask:radial-gradient(circle,transparent 26%,#000 32%,transparent 68%);mask:radial-gradient(circle,transparent 26%,#000 32%,transparent 68%);
  animation:wx3d-spin 45s linear infinite}
.wx3d-rays.r2{animation-duration:30s;animation-direction:reverse;opacity:.55;transform:scale(.85)}
.wx3d-core{inset:30%;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fffbe0,#ffc431 70%);
  box-shadow:0 0 40px 16px rgba(255,200,70,.55);animation:wx3d-pulse 4s ease-in-out infinite}
.wx3d-moon{position:absolute;inset:34%;border-radius:50%;box-shadow:inset -16px -6px 0 0 #f5f3ce;
  filter:drop-shadow(0 0 14px rgba(245,243,206,.6));transform:rotate(-20deg)}
.wx3d-clouds,.wx3d-fx{inset:0}
.wx3d-cloud{position:absolute;display:block;width:3.2em;height:1em;border-radius:1em;background:var(--cl);
  filter:drop-shadow(0 6px 6px rgba(20,50,90,.3));animation:wx3d-pass 16s ease-in-out infinite alternate}
.wx3d-cloud::before,.wx3d-cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.wx3d-cloud::before{width:1.3em;height:1.3em;left:.45em;top:-.65em}
.wx3d-cloud::after{width:1em;height:1em;left:1.6em;top:-.4em}
.t-w{--cl:rgba(255,255,255,.93)}.t-g{--cl:#bcc7d2}.t-d{--cl:#7b8798}
.wx3d.night .t-w{--cl:#c9d4e6}.wx3d.night .t-g{--cl:#8996a8}.wx3d.night .t-d{--cl:#5d6777}
/* capa 3D: las partículas viven delante y detrás del contenido */
.wx3d-p3{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.wx3d-p3>*{position:absolute}
.wx3d-d{top:0;left:0}
.wx3d-rain{width:var(--w);height:var(--l)}
.wx3d-rain::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2.5px;transform:translateX(-50%);border-radius:2px;
  background:linear-gradient(transparent,rgba(120,215,255,.9))}
.wx3d-rain::after{content:"";position:absolute;left:0;bottom:0;width:var(--w);height:var(--w);border-radius:0 50% 50% 50%;transform:rotate(45deg);
  background:radial-gradient(circle at 35% 35%,#fff 0 13%,#9fe8ff 38%,#18b0ff);
  box-shadow:inset -2px -3px 5px rgba(0,100,200,.55),0 0 14px 2px rgba(60,200,255,.85)}
.wx3d-snow{border-radius:50%;background:#fff}
.wx3d-hail{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9d4ee)}
.wx3d-glass{width:9px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,255,255,.2) 45%,rgba(170,205,240,.18));
  box-shadow:0 2px 3px rgba(0,0,0,.28);opacity:0;animation:wx3d-slide ease-in infinite}
.wx3d-leaf{left:0;top:0;width:14px;height:7px;border-radius:70% 0 70% 0;background:#8fbf6a;opacity:.9;animation:wx3d-leaf linear infinite}
.wx3d-flare{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,240,200,.5),transparent 70%);animation:wx3d-twinkle 4s ease-in-out infinite}
.wx3d-shoot{top:14%;left:78%;width:70px;height:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;animation:wx3d-shoot 7s ease-in infinite}
.wx3d-frost{inset:0;border-radius:24px;box-shadow:inset 0 0 36px rgba(255,255,255,.45),inset 0 0 6px rgba(255,255,255,.6)}
.wx3d-pile{left:-5%;right:-5%;bottom:-6px;border-radius:50% 50% 0 0/100% 100% 0 0;background:#fff;box-shadow:0 -6px 18px rgba(255,255,255,.5)}
.wx3d-star{width:3px;height:3px;border-radius:50%;background:#fff;animation:wx3d-twinkle 3s ease-in-out infinite}
.wx3d-fog{left:-10%;width:120%;height:64px;border-radius:50%;background:rgba(232,240,246,.4);filter:blur(12px);animation:wx3d-fogdrift 14s ease-in-out infinite alternate}
.wx3d-streak{left:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:wx3d-gust linear infinite}
.wx3d-flash{inset:0;background:radial-gradient(circle at var(--fx,60%) 15%,var(--c),transparent 75%);opacity:0;animation:wx3d-flash 7s infinite}
.wx3d-bolt{opacity:0;overflow:visible;animation:wx3d-bolt 7s infinite;filter:drop-shadow(0 0 5px var(--c)) drop-shadow(0 0 16px var(--c))}
.wx3d-glare{inset:0;border-radius:24px;pointer-events:none;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.25),transparent 55%)}
.wx3d-content{position:relative;transform-style:preserve-3d;text-shadow:0 2px 8px rgba(5,15,30,.35)}
.wx3d-city{font-size:19px;font-weight:600;color:var(--wx-ink2);transform:translateZ(18px)}
.wx3d-temp{font-size:112px;font-weight:700;line-height:.95;margin:6px 0 6px;letter-spacing:-3px;transform:translateZ(60px);text-shadow:0 16px 22px rgba(5,15,30,.5)}
.wx3d-status{font-size:24px;font-weight:600;margin-bottom:26px;transform:translateZ(30px)}
.wx3d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;transform-style:preserve-3d}
.wx3d-stat{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:18px;cursor:pointer;outline:none;
  background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.35);
  transform-style:preserve-3d;transform:translateZ(26px);transition:transform .2s ease-out,box-shadow .2s;box-shadow:0 14px 16px -8px rgba(5,15,30,.55)}
.wx3d-stat:hover,.wx3d-stat:focus-visible,.wx3d-stat.open{transform:translateZ(48px) scale(1.04);box-shadow:0 22px 24px -8px rgba(5,15,30,.6),0 0 0 1.5px var(--ac)}
.wx3d-ico{width:44px;height:44px;overflow:visible;filter:drop-shadow(0 0 7px var(--ac));transform:translateZ(14px);animation:wx3d-bob 3.2s ease-in-out infinite}
.wx3d-stat b{font-size:30px;line-height:1;white-space:nowrap;text-align:center}
.wx3d-stat small{display:block;margin-top:3px;font-size:14px;font-weight:600;color:var(--wx-ink2)}
.wx3d-stat>span{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,8px) translateZ(20px);opacity:0;pointer-events:none;white-space:nowrap;
  padding:6px 14px;border-radius:999px;font-size:15px;font-weight:600;background:rgba(8,22,40,.92);border:1px solid var(--ac);transition:opacity .18s,transform .18s}
.wx3d-stat:hover>span,.wx3d-stat:focus-visible>span,.wx3d-stat.open>span{opacity:1;transform:translate(-50%,0) translateZ(20px)}
.wx3d-sec{transform-origin:24px 24px;animation:wx3d-spin 60s linear infinite}
@keyframes wx3d-bob{50%{transform:translateZ(14px) translateY(-3px)}}
@media (max-width:400px){.wx3d-temp{font-size:92px}.wx3d-stat b{font-size:25px}.wx3d-status{font-size:20px}}
@keyframes wx3d-fall{from{transform:translate3d(0,-30px,var(--z))}to{transform:translate3d(0,var(--h),var(--z))}}
@keyframes wx3d-snow{from{transform:translate3d(0,-20px,var(--z))}to{transform:translate3d(var(--sw),var(--h),var(--z))}}
@keyframes wx3d-hail{0%{transform:translate3d(0,-30px,var(--z))}78%{transform:translate3d(0,var(--h),var(--z))}86%{transform:translate3d(0,calc(var(--h) - 16px),var(--z))}94%,100%{transform:translate3d(0,var(--h),var(--z))}}
@keyframes wx3d-slide{0%{opacity:0;transform:translate3d(0,0,80px) scale(.5)}12%{opacity:1;transform:translate3d(0,0,80px) scale(1)}55%{transform:translate3d(0,30px,80px)}100%{opacity:0;transform:translate3d(0,150px,80px)}}
@keyframes wx3d-leaf{from{transform:translate3d(-20px,var(--y),var(--z)) rotate(0)}to{transform:translate3d(360px,calc(var(--y) + 40px),var(--z)) rotate(540deg)}}
@keyframes wx3d-shoot{0%,72%{opacity:0;transform:translate(0,0) rotate(-25deg)}74%{opacity:1}84%,100%{opacity:0;transform:translate(-110px,52px) rotate(-25deg)}}
@keyframes wx3d-float{50%{transform:rotateX(2deg) rotateY(-8deg) translateY(-6px)}}
@keyframes wx3d-spin{to{transform:rotate(360deg)}}
@keyframes wx3d-pulse{50%{transform:scale(1.08)}}
@keyframes wx3d-pass{from{transform:translateX(-12px)}to{transform:translateX(34px)}}
@keyframes wx3d-twinkle{50%{opacity:.2}}
@keyframes wx3d-fogdrift{from{transform:translate3d(0,0,var(--z,0))}to{transform:translate3d(9%,0,var(--z,0))}}
@keyframes wx3d-gust{from{transform:translateX(-140px)}to{transform:translateX(480px)}}
@keyframes wx3d-shake{20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,0)}80%{transform:translate(1px,1px)}}
@keyframes wx3d-bolt{0%,84%,92%,100%{opacity:0}85%{opacity:1}87%{opacity:.25}89%{opacity:1}90%{opacity:.6}}
@keyframes wx3d-flash{0%,84%,92%,100%{opacity:0}86%{opacity:.75}89%{opacity:.2}90%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.wx3d[data-respect-motion] *{animation:none!important}.wx3d[data-respect-motion] .wx3d-glass,.wx3d[data-respect-motion] .wx3d-leaf,.wx3d[data-respect-motion] .wx3d-streak{display:none}}
/* ===== hasta acá (falta el <div> y el <script> de abajo) ===== */
</style>
</head>
<body>

<div class="wx3d" id="wx3d">
  <div class="wx3d-card">
    <div class="wx3d-layer"></div><div class="wx3d-layer"></div><div class="wx3d-layer"></div>
    <div class="wx3d-face">
      <div class="wx3d-bg">
        <canvas class="wx3d-glassfx" aria-hidden="true"></canvas>
        <div class="wx3d-sky" aria-hidden="true"></div><div class="wx3d-clouds" aria-hidden="true"></div>
        <canvas class="wx3d-pback" aria-hidden="true"></canvas><div class="wx3d-fx" aria-hidden="true"></div><div class="wx3d-lite"></div><div class="wx3d-glare"></div>
      </div>
      <div class="wx3d-p3" aria-hidden="true"></div>
      <canvas class="wx3d-bolts" aria-hidden="true"></canvas>
      <canvas class="wx3d-pfront" aria-hidden="true"></canvas>
      <div class="wx3d-content">
        <div class="wx3d-city" data-f="city"></div>
        <div class="wx3d-temp" data-f="temp"></div>
        <div class="wx3d-status" data-f="status"></div>
        <div class="wx3d-stats">
          <div class="wx3d-stat" tabindex="0" role="button" style="--ac:#4de1ff">
            <svg class="wx3d-ico" viewBox="0 0 48 48" fill="none" stroke-linecap="round" aria-hidden="true"><defs><linearGradient id="wxgW" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a6f4ff"/><stop offset="1" stop-color="#1e90ff"/></linearGradient></defs>
              <path d="M4 16q5-6 10 0t10 0 10 0 10 0" stroke="url(#wxgW)" stroke-width="4"/><path d="M4 26q5-6 10 0t10 0 10 0 10 0" stroke="url(#wxgW)" stroke-width="4" opacity=".8"/><path d="M4 36q5-6 10 0t10 0 10 0 10 0" stroke="url(#wxgW)" stroke-width="4" opacity=".55"/></svg>
            <b data-f="waves"></b><span>Oleaje estimado</span></div>
          <div class="wx3d-stat" tabindex="0" role="button" style="--ac:#5cf0c0">
            <svg class="wx3d-ico" viewBox="0 0 48 48" fill="none" stroke-linecap="round" aria-hidden="true"><defs><linearGradient id="wxgV" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0fffb"/><stop offset="1" stop-color="#22d3a5"/></linearGradient></defs>
              <path d="M6 18h24a6 6 0 1 0-6-6" stroke="url(#wxgV)" stroke-width="4"/><path d="M6 28h32a6 6 0 1 1-6 6" stroke="url(#wxgV)" stroke-width="4"/><path d="M6 38h14" stroke="url(#wxgV)" stroke-width="4" opacity=".7"/></svg>
            <b data-f="wind"></b><span>Viento</span></div>
          <div class="wx3d-stat" tabindex="0" role="button" style="--ac:#ffc14d">
            <svg class="wx3d-ico" viewBox="0 0 48 48" fill="none" stroke-linecap="round" aria-hidden="true"><defs><linearGradient id="wxgT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe49a"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient></defs>
              <circle cx="24" cy="24" r="19" stroke="url(#wxgT)" stroke-width="4"/><path d="M24 12v12l8 5" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/><line class="wx3d-sec" x1="24" y1="24" x2="24" y2="9" stroke="#ff7a59" stroke-width="2"/><circle cx="24" cy="24" r="2.5" fill="#fff"/></svg>
            <b data-f="time"></b><span>Hora local</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="demo" id="d-status" style="font-size:12px;opacity:.75;max-width:340px;text-align:center"></div>
<div class="demo">
  <select id="d-cond"></select>
  <label><input type="checkbox" id="d-night"> Noche</label>
  <button id="d-cycle">Recorrer las 20</button>
</div>

<!-- Librería de gotas sobre vidrio (WebGL2, MIT). Si no carga, el widget usa sus gotas CSS. Podés descargarla y alojarla vos. -->
<script src="https://cdn.jsdelivr.net/npm/raindrop-fx@1.0.8/bundle/index.js"></script>
<script>
(function(){
  var G={c:['#4f86bd','#1c3f68','#1b2a55','#0c1430'],p:['#5d84ab','#2f4f73','#232f55','#10183a'],
    o:['#6b7d8e','#3c4b5a','#2a3340','#151b24'],r:['#50647a','#2a3a4c','#1f2937','#0f151e'],
    t:['#3d4659','#1b2130','#1a1d2e','#0a0c16'],s:['#7790a8','#41576d','#2b3a4f','#141d2a'],
    f:['#7f8e99','#4b5963','#353e46','#1b2025'],w:['#5a89a8','#2c5470','#1d2c4d','#0d1630']};
  var gy=[[34,'g',40,22,26],[30,'g',60,6,30],[26,'g',54,42,22]],
      dk=[[38,'d',40,18,24],[32,'d',60,4,28],[28,'d',54,40,22]];
  // l=texto, e=emoji día|noche, g=gradiente, s=visibilidad sol/luna, k=nubes [tamaño,tono,x%,y%,seg], p=precipitación, b=rayo, f=niebla, w=viento
  var C={
    clear:{l:'Despejado',e:'☀️|🌙',g:'c',s:1,k:[]},
    fewclouds:{l:'Mayormente despejado',e:'🌤️|🌙',g:'c',s:1,k:[[20,'w',58,40,16]]},
    partly:{l:'Parcialmente nublado',e:'⛅|☁️',g:'p',s:.95,k:[[30,'w',48,34,15],[20,'w',66,10,22]]},
    overcast:{l:'Cubierto',e:'☁️',g:'o',s:0,k:gy},
    fog:{l:'Neblina',e:'🌫️',g:'f',s:.3,k:[],f:1},
    drizzle:{l:'Llovizna',e:'🌦️|🌧️',g:'r',s:0,k:gy.slice(0,2),p:['rain',16,1.4,10],gl:3},
    rain:{l:'Lluvia',e:'🌧️',g:'r',s:0,k:gy,p:['rain',34,.9,16],gl:5},
    heavy:{l:'Lluvia intensa',e:'🌧️',g:'r',s:0,k:dk,p:['rain',70,.6,22],gl:8},
    showers:{l:'Chubascos',e:'🌦️|🌧️',g:'r',s:0,k:[[32,'g',44,28,20],[26,'w',62,8,24],[22,'d',56,42,18]],p:['rain',48,.75,18],gl:6,pu:1},
    storm:{l:'Tormenta eléctrica',e:'⛈️',g:'t',s:0,k:dk,p:['rain',55,.65,20],b:1,gl:8}
  };
  var root=document.getElementById('wx3d'),card=root.querySelector('.wx3d-card'),glare=root.querySelector('.wx3d-glare'),
      sky=root.querySelector('.wx3d-sky'),clouds=root.querySelector('.wx3d-clouds'),fx=root.querySelector('.wx3d-fx'),p3=root.querySelector('.wx3d-p3');
  var S={cond:'partly',night:false,city:'Montevideo · Ahora',temp:22,waves:0.8,wind:18,time:'',tz:'America/Montevideo'};
  function R(a,b){return a+Math.random()*(b-a)}
  function set(d){
    for(var k in d)S[k]=d[k];
    var c=C[S.cond]||C.clear,n=!!S.night,g=G[c.g],h='',i;
    root.classList.toggle('night',n);
    root.style.setProperty('--b1',g[n?2:0]);root.style.setProperty('--b2',g[n?3:1]);
    sky.innerHTML=c.s>0?(n?'<div class="wx3d-moon" style="opacity:'+c.s+'"></div>'
      :'<div class="wx3d-sunwrap" style="opacity:'+c.s+'"><div class="wx3d-rays"></div><div class="wx3d-rays r2"></div><div class="wx3d-core"></div></div>'):'';
    clouds.innerHTML=c.k.map(function(k,i){return '<i class="wx3d-cloud t-'+k[1]+'" style="font-size:'+k[0]+'px;left:'+k[2]+'%;top:'+k[3]+'%;animation-duration:'+k[4]+'s;animation-delay:-'+(i*5)+'s"></i>'}).join('');
    if(n){var ns=c.s>=.9?46:c.s>=.4?18:c.s>0?8:0;
      if(ns){h+='<div class="wx3d-stars">'+(c.s>=.9?'<b class="wx3d-milky"></b>':'');
        for(i=0;i<ns;i++){var r=Math.random(),sz=r>.9?3.4:r>.6?2.2:1.4;
