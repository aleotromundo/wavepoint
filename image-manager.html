<meta name="robots" content="noindex,nofollow">
<title>WavePoint · Gestor de fotos</title>
<style>
:root{--ink:#15242c;--muted:#5d6a70;--paper:#f6f8f7;--surface:#fff;--line:#dce5e2;--sea:#006e78;--sea-dark:#005961;--sea-soft:#e4f2f0;--sand:#c47f45;--sand-soft:#fff3e5;--sand-ink:#7a4513;--danger:#a63a2b;--radius:16px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Página */
.shell{max-width:1360px;margin:auto;padding:32px clamp(16px,4vw,56px) 64px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
h1{margin:0;font:400 clamp(30px,4.5vw,48px)/1.05 Georgia,serif;letter-spacing:-.03em}
.intro{max-width:620px;margin:12px 0 0;color:var(--muted);font-size:16px}
.top-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--sea);color:var(--sea-dark)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--sea-dark);border-color:var(--sea-dark);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.btn.danger:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
.count{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--sea-soft);color:var(--sea-dark);font-size:13px}
.btn.primary .count{background:#ffffff30;color:#fff}
.link{border:0;background:none;padding:0;color:var(--sea-dark);font-weight:700;text-decoration:underline}

/* Filtros */
.controls{position:sticky;top:10px;z-index:3;display:grid;grid-template-columns:minmax(220px,1fr) 210px auto;gap:10px;padding:10px;margin-bottom:12px;background:#f6f8f7ee;border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px)}
.controls input,.controls select{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 13px;background:#fff}
.seg{display:flex;gap:2px;padding:3px;background:#fff;border:1px solid var(--line);border-radius:12px}
.seg button{height:36px;padding:0 14px;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:700;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.seg small{margin-left:5px;font-weight:600;opacity:.7}
.view-note{margin:0 0 14px;color:var(--muted);font-size:13px;min-height:20px}

/* Galería */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--radius);transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--sea);box-shadow:0 10px 30px #16333a18}
.card.planned{border-color:var(--sand);box-shadow:0 0 0 2px var(--sand)}
.thumb,.pthumb{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:#dce8e6}
.thumb img,.pthumb img,.mini img,.pimg img,.cthumb img{display:block;width:100%;height:100%;object-fit:cover}
.broken{display:grid;place-items:center;background:repeating-linear-gradient(135deg,#e4ecea 0 10px,#dce5e2 10px 20px)}
.broken::after{content:"Sin vista previa";color:var(--muted);font-size:12px;text-align:center;padding:4px}
.cthumb.broken::after,.mini.broken::after{content:""}
.badges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.badge{padding:4px 9px;border-radius:999px;background:#ffffffe8;font-size:11px;font-weight:800}
.badge.free{background:var(--sand-soft);color:var(--sand-ink)}
.badge.plan{background:var(--sand);color:#fff}
.mini{position:absolute;right:10px;bottom:10px;display:block;width:64px;height:48px;overflow:hidden;border:3px solid #fff;border-radius:10px;background:#dce8e6;box-shadow:0 4px 14px #0003}
.card-body{display:block;padding:12px 14px 14px}
.cname{display:block;font-size:14px;font-weight:700;line-height:1.3;word-break:break-word}
.cmeta{display:block;margin-top:2px;color:var(--muted);font-size:12px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;background:#fff}
.empty.wide{grid-column:1/-1}
.empty .btn{margin-top:14px}

/* Ventanas (detalle y plan) */
.backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#12252bb3;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
.backdrop.open{opacity:1;visibility:visible}
.backdrop.side{place-items:stretch end;padding:0}
.sheet{display:flex;flex-direction:column;width:min(940px,100%);max-height:calc(100dvh - 40px);overflow:hidden;background:#fff;border-radius:22px;box-shadow:0 30px 90px #00161d66;transform:translateY(12px);transition:transform .2s}
.backdrop.open .sheet{transform:none}
.sheet.drawer{width:min(520px,100%);height:100dvh;max-height:none;border-radius:22px 0 0 22px;transform:translateX(24px)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font:400 26px/1.1 Georgia,serif;letter-spacing:-.02em}
.sheet-head p{margin:4px 0 0;color:var(--muted);font-size:13px;word-break:break-all}
.close{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:var(--paper);font-size:24px;line-height:1}
.close:hover{background:var(--sea-soft)}
.sheet-body{flex:1;overflow:auto;padding:20px 22px}
.sheet-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#fff}
.foot-r{display:flex;gap:8px;margin-left:auto}

/* Antes / después */
.panes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pane{margin:0;min-width:0}
.pane figcaption{font-size:13px;font-weight:800}
.pimg{height:clamp(150px,26vh,260px);margin-top:6px;overflow:hidden;border-radius:14px;background:#e9f0ee}
.pimg.empty-slot{display:grid;place-items:center;padding:14px;text-align:center;color:var(--muted);font-size:13px;background:#f3faf8;border:2px dashed #b8cfcb}
.pane-name{margin:6px 0 0;font-size:13px;font-weight:700;word-break:break-all}
.info{display:grid;gap:10px;margin-top:14px;font-size:13px}
.pills,.usage-list{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pill{padding:4px 10px;border-radius:999px;background:var(--sea-soft);color:#075962;font-size:12px;font-weight:800}
.pill.sand{background:var(--sand-soft);color:var(--sand-ink)}
.usage-list code,.path{padding:4px 8px;border-radius:7px;background:var(--paper);color:var(--muted);font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.path-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-weight:700}
.small:hover{border-color:var(--sea);color:var(--sea-dark)}

/* Opciones para elegir la foto nueva */
.tabs{display:flex;gap:4px;margin:20px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:none;margin-bottom:-1px;padding:10px 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-weight:700}
.tab.on{color:var(--sea-dark);border-color:var(--sea)}
.hint{margin:0 0 12px;color:var(--muted);font-size:13px}
.pick-tools{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pick-tools input{flex:1;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 13px}
.pick-tools span{color:var(--muted);font-size:13px;white-space:nowrap}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pick{display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:left;background:#fff;border:2px solid transparent;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.pick:hover{box-shadow:0 0 0 1px var(--sea)}
.pick.on{border-color:var(--sand);box-shadow:0 0 0 1px var(--sand)}
.pthumb .badge{position:absolute;top:6px;left:6px}
.check{position:absolute;top:6px;right:6px;display:none;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sand);color:#fff;font-weight:800}
.pick.on .check{display:grid}
.pk-name{display:block;padding:6px 8px 0;font-size:12px;font-weight:700;line-height:1.25;word-break:break-all}
.pk-sec{display:block;padding:0 8px 8px;color:var(--muted);font-size:11px}
.drop{display:grid;justify-items:center;gap:6px;padding:34px 16px;text-align:center;cursor:pointer;border:2px dashed #a9c9c5;border-radius:16px;background:#f3faf8}
.drop.over{background:var(--sea-soft);border-color:var(--sea)}
.drop:focus-within{outline:3px solid var(--sea);outline-offset:2px}
.drop strong{font-size:16px}
.drop span{color:var(--muted)}
.drop .btn{margin-top:8px;color:#fff;pointer-events:none}
.online-q{width:100%;height:44px;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;padding:0 13px}
.search-links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.search-links a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;color:var(--sea-dark);font-weight:800;text-decoration:none}
.search-links a:hover{border-color:var(--sea);background:var(--sea-soft)}

/* Pie de la ventana de detalle */
.chosen{display:flex;align-items:center;gap:10px;min-width:0;flex:1;font-size:13px}
.chosen-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.cthumb{display:block;flex:none;width:64px;height:48px;overflow:hidden;border-radius:8px;background:#dce8e6}
.cthumb.sm{width:44px;height:33px}

/* Plan de cambios */
.change{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.pair{display:flex;align-items:center;gap:6px}
.arrow{color:var(--muted)}
.ctext p{margin:0;font-size:13px;word-break:break-all}
.ctext .warn{margin-top:4px;color:var(--sand-ink)}
.cact{grid-column:1/-1;display:flex;gap:8px}

.toast{position:fixed;left:50%;bottom:22px;z-index:40;max-width:calc(100% - 32px);padding:12px 18px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px;box-shadow:0 15px 40px #00161d44;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s}
.toast.show{transform:translate(-50%,0);opacity:1}

@media(max-width:760px){
  .controls{position:static;grid-template-columns:1fr}
  .seg{overflow-x:auto}
  .seg button{flex:1}
}
@media(max-width:640px){
  .shell{padding:22px 14px 48px}
  .topbar{flex-direction:column}
  .top-actions{justify-content:flex-start}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .card-body{padding:10px 12px 12px}
  .mini{width:48px;height:36px}
  .backdrop{place-items:end;padding:0}
  .sheet,.sheet.drawer{width:100%;height:auto;max-height:94dvh;border-radius:22px 22px 0 0;transform:translateY(24px)}
  .backdrop.side{place-items:end}
  .sheet-head,.sheet-body{padding-left:16px;padding-right:16px}
  .sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .panes{gap:10px}
  .pimg{height:130px}
  .pick-grid{grid-template-columns:1fr 1fr}
  .foot-r{width:100%}
  .foot-r .btn{flex:1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<main class="shell">
  <header class="topbar">
    <div>
      <h1>Fotos de WavePoint</h1>
      <p class="intro">Tocá una foto para cambiarla por otra. Los cambios quedan en un plan que descargás al final; el sitio no se modifica solo.</p>
    </div>
    <div class="top-actions">
      <button class="btn" id="installBtn" hidden>Instalar app</button>
      <button class="btn" id="planBtn">Plan de cambios <span class="count" id="planCount">0</span></button>
    </div>
  </header>

  <section class="controls" aria-label="Buscar y filtrar">
    <input id="search" type="search" placeholder="Buscar por nombre, sección o ruta" aria-label="Buscar fotos">
    <select id="section" aria-label="Sección"></select>
    <div class="seg" id="seg" role="group" aria-label="Estado de la foto"></div>
  </section>
  <p class="view-note" id="viewNote" aria-live="polite"></p>
  <section class="grid" id="grid"></section>
</main>

<div class="backdrop" id="modalBackdrop">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="sheet-head">
      <div><h2 id="modalTitle">Cambiar foto</h2><p id="modalSub"></p></div>
      <button class="close" id="closeModal" aria-label="Cerrar">×</button>
    </header>
    <div class="sheet-body" id="modalContent"></div>
    <footer class="sheet-foot" id="modalFoot"></footer>
  </section>
</div>

<div class="backdrop side" id="planBackdrop">
  <section class="sheet drawer" role="dialog" aria-modal="true" aria-labelledby="planTitle">
    <header class="sheet-head">
      <div><h2 id="planTitle">Plan de cambios</h2><p>Se guarda en este navegador.</p></div>
      <button class="close" id="closePlan" aria-label="Cerrar">×</button>
    </header>
    <div class="sheet-body" id="planList"></div>
    <footer class="sheet-foot" id="planFoot"></footer>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>

/* ---------- utilidades ---------- */
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes = n => n > 1048576 ? `${(n/1048576).toFixed(1)} MB` : `${Math.round(n/1024)} KB`;
const fileUrl = p => encodeURI(p);
const src = it => it.preview || fileUrl(it.path);
const img = (s, alt) => `<img src="${esc(s)}" alt="${esc(alt)}" loading="lazy" onerror="this.parentNode.classList.add('broken');this.remove()">`;
const findAny = p => [...state.uploads, ...CATALOG].find(x => x.path === p);
const changeFor = p => state.changes.find(c => c.target === p);
const missingItem = p => ({ name: p.replace('[subida] ', ''), path: p, missing: true });
const usageText = x => !x.used ? 'Sin usar en el sitio' : x.usage.length === 1 ? `Usada en ${x.usage[0]}` : `Usada en ${x.usage.length} páginas`;
const SECTIONS = [...new Set(CATALOG.map(x => x.section))];

function flash(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(flash.t); flash.t = setTimeout(() => toast.classList.remove('show'), 2600);
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(state.changes)) } catch {} }
function copy(text) { navigator.clipboard?.writeText(text); flash('Ruta copiada'); }

/* ---------- galería ---------- */
function filtered() {
  const q = state.query.trim().toLowerCase();

    (state.mode === 'all' || (state.mode === 'used') === x.used) &&

  const ch = changeFor(x.path), rep = ch && findAny(ch.replacement);
  const badges = (!x.used ? '<span class="badge free">Disponible</span>' : '') + (ch ? '<span class="badge plan">Cambio listo</span>' : '');
  return `<button class="card${ch ? ' planned' : ''}" data-open="${esc(x.path)}">
    <span class="thumb">${img(src(x), x.name)}${badges ? `<span class="badges">${badges}</span>` : ''}${ch && rep ? `<span class="mini">${img(src(rep), 'Foto nueva')}</span>` : ''}</span>
    <span class="card-body"><span class="cname">${esc(x.name)}</span><span class="cmeta">${esc(x.section)}</span><span class="cmeta">${esc(usageText(x))}</span></span>
  </button>`;
}

function render() {
  const items = filtered();
  $('#viewNote').innerHTML = `Mostrando ${items.length} de ${CATALOG.length} fotos` + (filtersActive() ? ' · <button class="link" data-clear>Quitar filtros</button>' : '');
  grid.innerHTML = items.length ? items.map(card).join('')
    : '<div class="empty wide">No hay fotos con esos filtros.<br><button class="btn" data-clear>Quitar filtros</button></div>';
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === state.mode));
  $('#planCount').textContent = state.changes.length;
  $('#planBtn').classList.toggle('primary', state.changes.length > 0);
}

function buildControls() {
  const count = s => CATALOG.filter(x => s === 'all' || x.section === s).length;
  $('#section').innerHTML = `<option value="all">Todas las secciones</option>` +
    SECTIONS.map(s => `<option value="${esc(s)}">${esc(s)} (${count(s)})</option>`).join('');
  const used = CATALOG.filter(x => x.used).length;
  $('#seg').innerHTML = [['all', 'Todas', CATALOG.length], ['used', 'En uso', used], ['available', 'Disponibles', CATALOG.length - used]]
    .map(([m, l, n]) => `<button data-mode="${m}">${l}<small>${n}</small></button>`).join('');
}

/* ---------- capas (ventanas) ---------- */
const lock = () => { document.body.style.overflow = (modal.classList.contains('open') || planBd.classList.contains('open')) ? 'hidden' : ''; };
function openLayer(el) { lastFocus = document.activeElement; el.classList.add('open'); lock(); }
function closeLayer(el) { el.classList.remove('open'); lock(); lastFocus?.focus?.(); }
const closeModal = () => closeLayer(modal);
const closePlan = () => closeLayer(planBd);

/* ---------- cambiar una foto ---------- */
function openDetail(path) {
  const it = findAny(path); if (!it) return;
  const ch = changeFor(path);
  state.detail = path; state.pick = ch ? ch.replacement : null;
  state.tab = 'gallery'; state.pickQuery = ''; state.onlineQ = `${it.section} Tamarindo Costa Rica surf`;
  $('#modalSub').textContent = it.name;
  modalContent.innerHTML = `
    <div class="panes">
      <figure class="pane"><figcaption>Foto actual</figcaption><div class="pimg">${img(src(it), it.name)}</div><p class="pane-name">${esc(it.name)}</p></figure>
      <figure class="pane" id="newPane"></figure>
    </div>
    <div class="info">
      <div class="pills"><span class="pill">${esc(it.section)}</span><span class="pill${it.used ? '' : ' sand'}">${it.used ? 'En uso' : 'Disponible'}</span>${it.bytes ? `<span class="pill">${bytes(it.bytes)}</span>` : ''}</div>
      ${it.used ? `<div class="usage-list"><span>Se usa en</span>${it.usage.map(u => `<code>${esc(u)}</code>`).join('')}</div>` : ''}
      <div class="path-row"><code class="path">${esc(it.path)}</code><button class="small" data-copy="${esc(it.path)}">Copiar ruta</button></div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="tabPanel"></div>`;
  renderNewPane(); renderTabs(); renderFoot();
  openLayer(modal); modalContent.scrollTop = 0; $('#closeModal').focus();
}

const pickItem = () => state.pick && (findAny(state.pick) || missingItem(state.pick));

function renderNewPane() {
  const it = pickItem();
  $('#newPane').innerHTML = '<figcaption>Foto nueva</figcaption>' + (it
    ? `<div class="pimg${it.missing ? ' broken' : ''}">${it.missing ? '' : img(src(it), it.name)}</div><p class="pane-name">${esc(it.name)}</p>`
    : '<div class="pimg empty-slot"><span>Elegí la foto nueva en las opciones de abajo</span></div><p class="pane-name muted">Sin elegir</p>');
}

function renderTabs() {
  $('#tabs').innerHTML = [['gallery', 'Elegir del inventario'], ['upload', 'Subir mi foto'], ['online', 'Buscar online']]
    .map(([k, l]) => `<button class="tab${state.tab === k ? ' on' : ''}" role="tab" aria-selected="${state.tab === k}" data-tab="${k}">${l}</button>`).join('');
  renderPanel();
}

function renderPanel() {
  const panel = $('#tabPanel'), cur = findAny(state.detail);
  if (state.tab === 'gallery') {
    panel.innerHTML = `<p class="hint">Primero van las fotos subidas y las disponibles, después las de la misma sección.</p>
      <div class="pick-tools"><input id="pickSearch" type="search" placeholder="Buscar por nombre o sección" aria-label="Buscar en el inventario" value="${esc(state.pickQuery)}"><span id="pickCount"></span></div>
      <div class="pick-grid" id="pickGrid"></div>`;
    fillPickGrid();
  } else if (state.tab === 'upload') {
    panel.innerHTML = `<label class="drop" id="drop"><input class="sr" type="file" id="fileIn" accept="image/*">
        <strong>Elegí una foto de tu dispositivo</strong><span>o arrastrala hasta acá</span><span class="btn primary">Elegir foto</span></label>
      <p class="hint" style="margin-top:12px">La foto queda solo en este navegador para comparar. Copiala a la carpeta de imágenes del sitio antes de publicar.</p>`;
    wireDrop();
  } else {
    panel.innerHTML = `<p class="hint">Buscá en bancos de fotos gratuitos. Cuando bajes una, subila en la pestaña “Subir mi foto”.</p>
      <input class="online-q" id="onlineQ" aria-label="Qué buscar" value="${esc(state.onlineQ)}">
      <div class="search-links" id="links"></div>
      <button class="btn" data-tab="upload">Ya la bajé, subirla</button>`;
    fillLinks();
  }
}

function fillPickGrid() {
  const cur = findAny(state.detail), q = state.pickQuery.trim().toLowerCase();
  const rank = x => x.upload ? 0 : !x.used ? 1 : x.section === cur.section ? 2 : 3;
  const list = [...state.uploads, ...CATALOG]
    .filter(x => x.path !== cur.path && (!q || `${x.name} ${x.section} ${x.path}`.toLowerCase().includes(q)))
    .sort((a, b) => rank(a) - rank(b));
  $('#pickCount').textContent = `${list.length} fotos`;
  $('#pickGrid').innerHTML = list.length ? list.map(x => {
    const on = x.path === state.pick;
    const tag = x.upload ? '<span class="badge">Subida</span>' : !x.used ? '<span class="badge free">Disponible</span>' : '';
    return `<button class="pick${on ? ' on' : ''}" data-pick="${esc(x.path)}" aria-pressed="${on}">
      <span class="pthumb">${img(src(x), x.name)}<span class="check" aria-hidden="true">✓</span>${tag}</span>
      <span class="pk-name">${esc(x.name)}</span><span class="pk-sec">${esc(x.section)}</span></button>`;
  }).join('') : '<div class="empty" style="grid-column:1/-1">No hay fotos con ese nombre.</div>';
}

function paintPick() {
  document.querySelectorAll('.pick').forEach(b => {
    const on = b.dataset.pick === state.pick;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
}

function fillLinks() {
  const q = encodeURIComponent(state.onlineQ.trim() || 'Tamarindo Costa Rica surf');
  const links = [
    ['Unsplash', 'https://unsplash.com/s/photos/' + q],
    ['Pexels', 'https://www.pexels.com/search/' + q],
    ['Wikimedia Commons', 'https://commons.wikimedia.org/w/index.php?search=' + q + '&title=Special:MediaSearch&go=Go&type=image'],
    ['Openverse', 'https://openverse.org/search/?q=' + q]
  ];
  $('#links').innerHTML = links.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n} ↗</a>`).join('');
}

function wireDrop() {
  const d = $('#drop'); if (!d) return;
  ['dragenter', 'dragover'].forEach(n => d.addEventListener(n, e => { e.preventDefault(); d.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(n => d.addEventListener(n, e => { e.preventDefault(); d.classList.remove('over'); }));
  d.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) addUpload(f); });
}

function addUpload(file) {
  if (!file.type.startsWith('image/')) { flash('Ese archivo no es una imagen'); return; }
  let path = `[subida] ${file.name}`, n = 2;
  while (findAny(path)) path = `[subida] ${file.name} (${n++})`;
  const item = { path, name: file.name, section: 'Subidas', used: false, usage: [], bytes: file.size, preview: URL.createObjectURL(file), upload: true };
  state.uploads.unshift(item);
  state.pick = path; state.tab = 'gallery'; state.pickQuery = '';
  renderTabs(); renderNewPane(); renderFoot();
  modalContent.scrollTo({ top: 0, behavior: 'smooth' });
  flash('Foto cargada y elegida como reemplazo');
}

function renderFoot() {
  const ch = changeFor(state.detail), same = ch && ch.replacement === state.pick, it = pickItem();
  $('#modalFoot').innerHTML = `
    <div class="chosen">${it
      ? `<span class="cthumb sm${it.missing ? ' broken' : ''}">${it.missing ? '' : img(src(it), it.name)}</span><span class="chosen-name">${esc(it.name)}</span>`
      : '<span class="muted">Todavía no elegiste la foto nueva</span>'}</div>
    <div class="foot-r">
      ${ch ? '<button class="btn ghost danger" data-act="remove">Quitar cambio</button>' : ''}
      <button class="btn primary" data-act="save" ${(!state.pick || same) ? 'disabled' : ''}>${same ? 'Cambio guardado' : 'Guardar cambio'}</button>
    </div>`;
}

function saveChange() {
  if (!state.pick) return;
  const it = pickItem();
  const change = { target: state.detail, replacement: state.pick, replacementPreview: null,
    source: it.upload ? 'subida desde dispositivo' : 'inventario activo', createdAt: new Date().toISOString() };
  const i = state.changes.findIndex(c => c.target === state.detail);
  if (i >= 0) state.changes[i] = change; else state.changes.push(change);
  persist(); closeModal(); render(); flash('Cambio guardado en el plan');
}
function removeChange(target) {
  state.changes = state.changes.filter(c => c.target !== target);
  persist(); render();
}

/* ---------- plan de cambios ---------- */
function renderPlan() {
  const n = state.changes.length;
  $('#planList').innerHTML = n ? state.changes.map((c, i) => {
    const t = findAny(c.target) || missingItem(c.target), r = findAny(c.replacement), rname = r ? r.name : c.replacement.replace('[subida] ', '');
    return `<article class="change">
      <div class="pair"><span class="cthumb">${img(src(t), t.name)}</span><span class="arrow" aria-hidden="true">→</span><span class="cthumb${r ? '' : ' broken'}">${r ? img(src(r), r.name) : ''}</span></div>
      <div class="ctext"><p><b>${esc(t.name)}</b></p><p class="muted">se cambia por ${esc(rname)}</p>${r ? '' : '<p class="warn">Esa foto subida ya no está cargada. Volvé a subirla antes de aplicar el plan.</p>'}</div>
      <div class="cact"><button class="small" data-edit="${i}">Editar</button><button class="small" data-del="${i}">Quitar</button></div>
    </article>`;
  }).join('') : '<div class="empty">Todavía no preparaste cambios.<br>Tocá una foto del inventario para empezar.</div>';
  $('#planFoot').innerHTML = `<button class="btn ghost danger" data-plan="clear" ${n ? '' : 'disabled'}>Vaciar plan</button>
    <div class="foot-r"><button class="btn primary" data-plan="export" ${n ? '' : 'disabled'}>Descargar plan</button></div>`;
}

function exportPlan() {
  const payload = { createdAt: new Date().toISOString(),
    note: 'Plan visual de reemplazo. Revisar rutas y copiar las fotos subidas al inventario antes de publicar.',
    changes: state.changes };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'wavepoint-photo-change-plan.json'; a.click();
  URL.revokeObjectURL(a.href); flash('Plan descargado');
}

/* ---------- eventos ---------- */
grid.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openDetail(b.dataset.open); });
document.addEventListener('click', e => {
  if (!e.target.closest('[data-clear]')) return;
  state.query = ''; state.section = 'all'; state.mode = 'all';
  $('#search').value = ''; $('#section').value = 'all'; render();
});
$('#search').oninput = e => { state.query = e.target.value; render(); };
$('#section').onchange = e => { state.section = e.target.value; render(); };
$('#seg').onclick = e => { const b = e.target.closest('[data-mode]'); if (b) { state.mode = b.dataset.mode; render(); } };

modalContent.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-copy],[data-pick]'); if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; renderTabs(); }
  else if (t.dataset.copy) copy(t.dataset.copy);
  else if (t.dataset.pick) { state.pick = t.dataset.pick; paintPick(); renderNewPane(); renderFoot(); }
});
modalContent.addEventListener('input', e => {
  if (e.target.id === 'pickSearch') { state.pickQuery = e.target.value; fillPickGrid(); }
  if (e.target.id === 'onlineQ') { state.onlineQ = e.target.value; fillLinks(); }
});
modalContent.addEventListener('change', e => {
  if (e.target.id !== 'fileIn') return;
  const f = e.target.files[0]; e.target.value = ''; if (f) addUpload(f);
});
$('#modalFoot').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'save') saveChange();
  if (b.dataset.act === 'remove') { removeChange(state.detail); closeModal(); flash('Cambio quitado del plan'); }
});
$('#closeModal').onclick = closeModal;
modal.onclick = e => { if (e.target === modal) closeModal(); };

$('#planBtn').onclick = () => { renderPlan(); openLayer(planBd); $('#closePlan').focus(); };
$('#closePlan').onclick = closePlan;
planBd.onclick = e => { if (e.target === planBd) closePlan(); };
$('#planList').addEventListener('click', e => {
  const b = e.target.closest('[data-edit],[data-del]'); if (!b) return;
  if (b.dataset.del !== undefined) { state.changes.splice(+b.dataset.del, 1); persist(); render(); renderPlan(); }
  else { const target = state.changes[+b.dataset.edit].target; closePlan(); openDetail(target); }
});
$('#planFoot').addEventListener('click', e => {
  const b = e.target.closest('[data-plan]'); if (!b) return;
  if (b.dataset.plan === 'export') exportPlan();
  if (b.dataset.plan === 'clear' && confirm('¿Quitar todos los cambios del plan?')) { state.changes = []; persist(); render(); renderPlan(); }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (planBd.classList.contains('open')) closePlan(); else if (modal.classList.contains('open')) closeModal();
});

/* ---------- instalar como app ---------- */
let deferredInstallPrompt = null; const installButton = $('#installBtn');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstallPrompt = e; installButton.hidden = false; });
installButton.onclick = async () => {
  if (deferredInstallPrompt) { deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt = null; installButton.hidden = true; }
  else flash('En iPhone: Compartir → Agregar a pantalla de inicio. En Android: menú del navegador → Instalar app.');
};
window.addEventListener('appinstalled', () => { installButton.hidden = true; flash('La app quedó instalada'); });

buildControls(); render();
</script>
</body>
</html>
